<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ご購入ありがとうございます｜リラックスサービス</title>
<style>
:root{--pink:#e75f9d;--pink-dark:#a13e69;--bg:#fff8fb;--line:#eadde3;--text:#302b2d;--muted:#756b70}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px 56px}
.brand{display:flex;align-items:center;justify-content:center;margin:4px 0 26px}
.brand img{width:148px;height:auto}
h1{font-size:24px;line-height:1.45;margin:0 0 8px}
.lead{font-weight:700;line-height:1.7;margin:0 0 18px}
.card,.phone,.notice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.card{line-height:1.8}
.phone strong{display:block;margin-top:6px;font-size:27px;line-height:1.2;color:#1647d8}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;padding:12px 14px;margin:10px 0;border:0;border-radius:10px;background:var(--pink);color:#fff;text-decoration:none;font-size:16px;font-weight:800;text-align:center}
.btn.secondary{background:#fff;color:var(--pink-dark);border:1px solid #e6bdd0}
.small{font-size:12px;line-height:1.7;color:var(--muted)}
.actions{margin-top:20px}
.loading{padding:56px 8px;text-align:center}
.loading b{display:block;font-size:20px;margin-bottom:10px}
.error{display:none}
.bridge{position:absolute;width:1px;height:1px;opacity:0;border:0;pointer-events:none}
</style>
</head>
<body>
<main class="wrap">
<div class="brand"><img src="/assets/images/logo.png" alt="リラックスサービス"></div>

<section id="loading" class="loading" aria-live="polite">
<b>お支払いを確認しています</b>
<div class="small">そのまま少しお待ちください。</div>
</section>

<section id="success" hidden>
<h1>ご購入ありがとうございます</h1>
<p class="lead">お支払いを確認しました。</p>
<div class="card" id="ticket-card"></div>
<div id="phone-area"></div>
<div id="documents" class="actions"></div>
<p id="expires"></p>
<p class="small" id="confirmation"></p>
</section>

<section id="error" class="error">
<h1>確認に時間がかかっています</h1>
<p id="error-message">お支払い直後は反映に少し時間がかかる場合があります。</p>
<button class="btn" type="button" id="retry">もう一度確認する</button>
<p class="small">決済自体をもう一度行う必要はありません。</p>
</section>

<iframe id="bridge" class="bridge" title="決済確認" aria-hidden="true"></iframe>
</main>

<script>
(function(){
  "use strict";

  const GAS_URL="https://script.google.com/macros/s/AKfycbyuumB90EbJS9sesozUegcU6GgNjyPPmqKbL3ztT37lqw7tOjkDwL4-ysuvNX4xsSWS6w/exec";
  const params=new URLSearchParams(location.search);
  const sessionId=String(params.get("session_id")||"");
  const loading=document.getElementById("loading");
  const success=document.getElementById("success");
  const error=document.getElementById("error");
  const errorMessage=document.getElementById("error-message");
  const bridge=document.getElementById("bridge");
  let timer=null;

  function trustedOrigin(origin){
    try{
      const u=new URL(origin);
      return u.protocol==="https:"&&(
        u.hostname==="script.google.com"||
        u.hostname==="script.googleusercontent.com"||
        u.hostname.endsWith(".googleusercontent.com")
      );
    }catch(_){return false}
  }

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function showError(message){
    clearTimeout(timer);
    loading.hidden=true;
    success.hidden=true;
    error.style.display="block";
    if(message) errorMessage.textContent=message;
  }

  function storedAttribution(){
    try{
      const raw=localStorage.getItem("relax_lp_attribution_v1");
      if(!raw)return {};
      const data=JSON.parse(raw);
      const ts=Number(data.attribution_ts||0);
      if(!ts||Date.now()-ts>7*24*60*60*1000)return {};
      return {
        utm_source:data.utm_source||"",
        utm_medium:data.utm_medium||"",
        utm_campaign:data.utm_campaign||"",
        utm_content:data.utm_content||"",
        landing_path:data.landing_path||""
      };
    }catch(_){return {}}
  }

  function track(data){
    if(!window.gtag){
      window.dataLayer=window.dataLayer||[];
      window.gtag=function(){window.dataLayer.push(arguments);};
      const s=document.createElement("script");
      s.async=true;
      s.src="https://www.googletagmanager.com/gtag/js?id=G-X63W5K5P5Q";
      document.head.appendChild(s);
      window.gtag("js",new Date());
      window.gtag("config","G-X63W5K5P5Q");
    }

    const key="relax_purchase_"+sessionId;
    try{
      if(!localStorage.getItem(key)){
        window.gtag("event","purchase_complete",data);
        localStorage.setItem(key,"1");
      }
    }catch(_){
      window.gtag("event","purchase_complete",data);
    }
  }

  function render(data){
    clearTimeout(timer);
    loading.hidden=true;
    error.style.display="none";
    success.hidden=false;

    document.getElementById("ticket-card").innerHTML=
      "<b>"+esc(data.counselorName)+"</b><br>"+
      esc(data.ticketLabel)+"<br>"+esc(data.amountLabel);

    const phoneArea=document.getElementById("phone-area");
    if(data.counselorPhone){
      const digits=String(data.counselorPhone).replace(/\D/g,"");
      phoneArea.innerHTML=
        '<div class="phone"><div>お電話先</div><strong>'+esc(data.counselorPhone)+'</strong></div>'+
        '<a class="btn phone-call" href="tel:'+esc(digits)+'">相談員へ電話をかける</a>'+
        '<p>購入時に入力した電話番号から、番号を通知してお電話ください。</p>';
    }else{
      phoneArea.innerHTML=
        '<div class="notice">相談員の電話番号を確認中です。時間をおいて再読み込みしてください。</div>';
    }

    const docs=[];
    if(data.receiptUrl){
      docs.push('<a class="btn secondary" href="'+esc(data.receiptUrl)+'" target="_blank" rel="noopener">領収書を開く</a>');
    }
    if(data.invoicePdfUrl){
      docs.push('<a class="btn secondary" href="'+esc(data.invoicePdfUrl)+'" target="_blank" rel="noopener">請求書PDFを開く</a>');
    }else if(data.invoiceUrl){
      docs.push('<a class="btn secondary" href="'+esc(data.invoiceUrl)+'" target="_blank" rel="noopener">請求書を確認する</a>');
    }
    document.getElementById("documents").innerHTML=docs.length
      ? '<div class="small">お支払い書類</div>'+docs.join("")
      : '<p class="small">請求書・領収書はStripeで準備でき次第ご確認いただけます。</p>';

    document.getElementById("expires").textContent=
      data.expiresLabel ? "有効期限："+String(data.expiresLabel) : "";

    document.getElementById("confirmation").textContent=
      data.confirmationId ? "決済確認番号："+String(data.confirmationId) : "";

    const analytics=Object.assign({
      lp_id:data.lpId,
      consultant_no:data.consultantNo,
      ticket_kind:data.ticketKind,
      duration:data.durationMinutes,
      amount:data.amountJpy,
      value:data.amountJpy,
      currency:"JPY"
    },storedAttribution());
    track(analytics);

    document.addEventListener("click",function(e){
      const a=e.target.closest&&e.target.closest("a.phone-call");
      if(!a||!window.gtag)return;
      window.gtag("event","call_click",Object.assign({
        lp_id:data.lpId,
        consultant_no:data.consultantNo,
        ticket_kind:data.ticketKind,
        duration:data.durationMinutes
      },storedAttribution()));
    },{once:true});
  }

  function load(){
    if(!/^cs_/.test(sessionId)){
      showError("注文情報を確認できませんでした。");
      return;
    }

    loading.hidden=false;
    success.hidden=true;
    error.style.display="none";

    const q=new URLSearchParams({
      action:"success_bridge",
      session_id:sessionId,
      parent_origin:location.origin
    });

    bridge.src=GAS_URL+"?"+q.toString()+"&_="+Date.now();

    clearTimeout(timer);
    timer=setTimeout(function(){
      showError("確認に時間がかかっています。もう一度確認してください。");
    },20000);
  }

  window.addEventListener("message",function(e){
    if(!trustedOrigin(e.origin))return;

    const data=e.data||{};
    if(data.source!=="relax-stripe-gas"||data.kind!=="purchase_success")return;

    if(data.ok) render(data);
    else showError(data.message||"お支払いを確認できませんでした。");
  });

  document.getElementById("retry").addEventListener("click",load);
  load();
})();
</script>
</body>
</html>
